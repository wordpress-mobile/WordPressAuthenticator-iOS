# Nodes with values to reuse in the pipeline.
common_params:
  plugins: &common_plugins
    - automattic/a8c-ci-toolkit#3.3.0
  env: &common_env
    IMAGE_ID: xcode-15.0.1

# This is the default pipeline – it will build and test the pod
steps:
  #################
  # Build and Test
  #################
  - label: "🧪 Build and Test"
    key: "test"
    command: .buildkite/build-and-test.sh
    env: *common_env
    plugins: *common_plugins

  - label: ":calling: Build Demo App"
    key: "build-demo-app"
    command: .buildkite/build-demo-app.sh
    env: *common_env
    plugins: *common_plugins

  #################
  # Validate Podspec
  #################
  - label: "🔬 Validate Podspec"
    key: "validate"
    command: |
      # This library use deprecated Gravatar API in WordPressUI.
      # Allow warning for now, until we are ready to migrate to Gravatar SDK.
      validate_podspec --patch-cocoapods --allow-warnings
    env: *common_env
    plugins: *common_plugins

  #################
  # Lint
  #################
  - label: ":swift: SwiftLint"
    command: swiftlint
    env:
      SWIFTLINT_OPTION_STRICT: "true"
    notify:
      - github_commit_status:
          context: "SwiftLint"
    agents:
      queue: "linter"

  - label: "🧹 Lint"
    key: "lint"
    command: |
      lint_pod
    env: *common_env
    plugins: *common_plugins

  #################
  # Publish the Podspec (if we're building a tag)
  #################
  - label: "⬆️ Publish Podspec"
    key: "publish"
    command: .buildkite/publish-pod.sh
    env: *common_env
    plugins: *common_plugins
    depends_on:
      - "test"
      - "validate"
      - "lint"
      - "build-demo-app"
    if: build.tag != null
    agents:
      queue: "mac"
